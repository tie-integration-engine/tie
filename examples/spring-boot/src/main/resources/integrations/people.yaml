# Loaded by PeopleImport. @INPUT_DIRECTORY@ is replaced with the people.input-directory property.
version: 1
id: people
direction: IMPORT
inputChannels:
  - { type: LOCAL_DIRECTORY, directory: "@INPUT_DIRECTORY@" }
layouts:
  - name: person
    fileNamePattern: people_{timestamp:yyyyMMdd}
    allowedFormats: [CSV]
    formatOptions:
      csv: { separator: ";" }
    fields:
      - { name: taxId, column: nif, transformer: upperNif }   # the FieldTransformer bean
      - { name: born, type: DATE, typeFormat: dd/MM/yyyy }
