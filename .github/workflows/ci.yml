name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build, test (slow tests included), sources and javadoc
        run: ./mvnw -B -ntp -P release install
      - name: Smoke test the examples against the installed artifacts
        run: |
          ./mvnw -B -ntp -f examples/plain-java/pom.xml verify
          ./mvnw -B -ntp -f examples/spring-boot/pom.xml verify
